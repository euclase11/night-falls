<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>наступает ночь</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Rubik:wght@400;500;700&family=Source+Sans+3:wght@400;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme.css">
</head>

<body data-world="real">
  <div class="atmosphere" aria-hidden="true">
    <div class="atm-furnace"></div>
    <div class="atm-sky"></div>
    <div class="atm-field"></div>
    <div class="atm-train"></div>
    <div class="atm-fog atm-fog-a"></div>
    <div class="atm-fog atm-fog-b"></div>
    <div class="atm-grain"></div>
  </div>

  <header class="top">
    <h1 class="title" id="site-title">наступает ночь</h1>

    <div class="segmented" id="world-switch" role="group" aria-label="Мир">
      <button type="button" data-world="real" aria-pressed="true">Реальный мир</button>
      <button type="button" data-world="afterlife" aria-pressed="false">Посмертие</button>
    </div>

    <!-- Блок для входа/выхода редактора -->
    <div id="auth-container">
      <form id="auth-form">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
      </form>
      <p id="auth-message"></p>
    </div>
    <button id="logout-btn" style="display:none;">Выйти</button>
  </header>

  <nav class="tabs" id="tabs" aria-label="Разделы">
    <button type="button" data-tab="timeline">Таймлайн</button>
    <button type="button" data-tab="map">Карта</button>
    <button type="button" data-tab="characters">Персонажи</button>
    <button type="button" data-tab="gallery">Галерея</button>
    <button type="button" data-tab="other">Другое</button>
  </nav>

  <main>
    <div class="toolbar" id="toolbar">
      <input class="search" id="search" type="search" autocomplete="off">
      <div class="subcontrols" id="subcontrols"></div>
    </div>
    <section id="view" aria-live="polite"></section>
  </main>

  <!-- Универсальная форма добавления (видна только после входа) -->
  <section id="entry-form-section" class="editor-only" hidden>
    <h2 id="entry-form-title">Добавить запись</h2>
    <form id="entry-form" class="add-form">
      <div id="entry-form-fields"></div>
      <div class="add-form-actions">
        <button type="submit" id="entry-submit">Сохранить</button>
        <button type="button" id="entry-cancel">Отмена</button>
      </div>
      <p id="entry-form-message"></p>
    </form>
  </section>

  <!-- Плавающая кнопка добавления (только после входа) -->
  <button type="button" id="open-entry-form" class="editor-only floating-add" hidden>
    + Добавить
  </button>

  <aside class="sheet" id="sheet" role="dialog" aria-label="Описание записи" hidden>
    <button type="button" class="sheet-close icon-btn" id="sheet-close" aria-label="Закрыть" title="Закрыть">
      <span class="icon icon-close" aria-hidden="true"></span>
    </button>
    <div id="sheet-body"></div>
  </aside>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/addEntry.js"></script>
</body>

</html>
