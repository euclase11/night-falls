<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Название ролевой</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-world="real">

  <header class="top">
    <h1 class="title" id="site-title">Название ролевой</h1>

    <div class="segmented" id="world-switch" role="group" aria-label="Мир">
      <button type="button" data-world="real" aria-pressed="true">Реальный мир</button>
      <button type="button" data-world="afterlife" aria-pressed="false">Посмертие</button>
    </div>

    <!-- Блок для входа/выхода редактора -->
    <div id="auth-container">
      <form id="auth-form">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
        <button type="button" id="signup-btn">Зарегистрироваться</button>
      </form>
      <p id="auth-message"></p>
    </div>
    <button id="logout-btn" style="display:none;">Выйти</button>
  </header>

  <nav class="tabs" id="tabs" aria-label="Разделы">
    <button type="button" data-tab="timeline">Таймлайн</button>
    <button type="button" data-tab="map">Карта</button>
    <button type="button" data-tab="characters">Персонажи</button>
    <button type="button" data-tab="other">Другое</button>
  </nav>

  <main>
    <div class="toolbar" id="toolbar">
      <input class="search" id="search" type="search" autocomplete="off">
      <div class="subcontrols" id="subcontrols"></div>
    </div>
    <section id="view" aria-live="polite"></section>
  </main>

  <!-- Форма добавления персонажа (видна только после входа) -->
  <section id="add-character" class="editor-only" hidden>
    <h2>Добавить персонажа</h2>
    <form id="character-form" class="add-form">
      <label>
        Имя
        <input type="text" id="char-name" required maxlength="80">
      </label>

      <label>
        Описание
        <textarea id="char-desc" rows="4" maxlength="2000"></textarea>
      </label>

      <label>
        Мир
        <select id="char-world">
          <option value="real">Реальный мир</option>
          <option value="afterlife">Посмертие</option>
        </select>
      </label>

      <label>
        Картинка
        <input type="file" id="char-image" accept="image/*">
      </label>

      <div class="add-form-actions">
        <button type="submit" id="char-submit">Сохранить</button>
        <button type="button" id="char-cancel">Отмена</button>
      </div>

      <p id="char-message"></p>
    </form>
  </section>

  <!-- Плавающая кнопка "Добавить персонажа" (только после входа) -->
  <button type="button" id="open-character-form" class="editor-only floating-add" hidden>
    + Добавить персонажа
  </button>

  <aside class="sheet" id="sheet" role="dialog" aria-label="Описание поселения" hidden>
    <button type="button" class="sheet-close" id="sheet-close">Закрыть</button>
    <div id="sheet-body"></div>
  </aside>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/addCharacter.js"></script>
</body>
</html>
